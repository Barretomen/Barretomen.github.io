name: Build temporary Wallet photo

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-wallet-photo-temp.yml'
      - 'assets/wallet/.photo_part_00.b64'
      - 'assets/wallet/.photo_part_01.b64'
      - 'assets/wallet/.photo_part_01b.b64'
      - 'assets/wallet/.photo_part_02.b64'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild JPEG
        run: |
          cat assets/wallet/.photo_part_00.b64 assets/wallet/.photo_part_01.b64 assets/wallet/.photo_part_01b.b64 assets/wallet/.photo_part_02.b64 | base64 -d > assets/wallet/joao_barreto_wallet_photo.jpg
          echo "size=$(stat -c%s assets/wallet/joao_barreto_wallet_photo.jpg)"
          test "$(stat -c%s assets/wallet/joao_barreto_wallet_photo.jpg)" -eq 22395
          file assets/wallet/joao_barreto_wallet_photo.jpg
      - name: Commit photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/wallet/joao_barreto_wallet_photo.jpg
          git commit -m "Add João Barreto Wallet profile photo"
          git push
